# ⚠ A CONFIRMAR: crear el proyecto en https://sonarcloud.io (Analyze new project → Sauremk/Pastel-Stock)
# y verificar que organization y projectKey coincidan con los que muestra SonarCloud.
# El token va como secreto SONAR_TOKEN en GitHub (Settings → Secrets and variables → Actions), NO aquí.
sonar.organization=sauremk
sonar.projectKey=Sauremk_Pastel-Stock
sonar.projectName=Pastel Stock

sonar.sources=src,web
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=**/node_modules/**,coverage/**,web/vendor/**

# Cobertura generada por c8 en el job "test" (se descarga como artefacto antes del scan).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# server.js solo arranca el proceso (bootstrap sin lógica); la lógica vive en app.js y los casos de uso.
sonar.coverage.exclusions=src/server.js,web/**

# Quality Gate BLOQUEANTE: el scanner espera el veredicto y sale con error si el gate falla (ADR-09).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
