global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml
scrape_configs:
  # La API publica sus métricas por OTLP al Collector, que las expone en :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
