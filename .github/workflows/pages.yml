# Publica la app sin servidor (PWA) en GitHub Pages. ADR-18.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'pwa/**', 'src/**/domain/**', 'src/shared/errors.js', 'src/db/datosDemo.js', 'scripts/build-pwa.mjs', 'package*.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del servidor local (mismas reglas que la API)
        run: node --test --no-warnings "tests/pwa/**/*.test.js"
      - run: npm run build:pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pwa

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
