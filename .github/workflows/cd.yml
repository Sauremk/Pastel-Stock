name: CD

# Continuous DELIVERY (ADR-11): build → push a GHCR por SHA → staging → aprobación manual → producción
# → healthcheck → rollback automático a la última imagen estable (o a un SHA concreto, manualmente).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Marcar para forzar rollback manual en producción"
        type: boolean
        default: false
      rollback_sha:
        description: "SHA de la imagen a restaurar (vacío = última imagen :stable)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false # nunca cancelar un despliegue a mitad de camino

env:
  IMAGE: ghcr.io/sauremk/pastel-stock # GHCR exige minúsculas

jobs:
  build:
    # Solo si el CI de un push a main terminó en verde (Quality Gate aprobado) o si se lanza a mano
    if: ${{ !inputs.rollback && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }} # etiqueta INMUTABLE por commit
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Disparar despliegue en Render (staging)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          curl -fsS -X POST -G --data-urlencode "imgURL=${IMAGE}:${SHA}" "$RENDER_HOOK"
      - name: Healthcheck posterior al despliegue (staging)
        env:
          URL: ${{ vars.STAGING_URL }}
          SHA: ${{ needs.build.outputs.sha }}
        run: ./scripts/healthcheck.sh "$URL" "$SHA"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: # Delivery: el Environment "production" exige un revisor aprobador (aprobación manual)
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Disparar despliegue en Render (producción)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          curl -fsS -X POST -G --data-urlencode "imgURL=${IMAGE}:${SHA}" "$RENDER_HOOK"
      - name: Healthcheck posterior al despliegue (producción)
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          SHA: ${{ needs.build.outputs.sha }}
        run: ./scripts/healthcheck.sh "$URL" "$SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Marcar la versión como estable (solo si el healthcheck pasó)
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: docker buildx imagetools create --tag "${IMAGE}:stable" "${IMAGE}:${SHA}"

  rollback:
    # Se ejecuta si el despliegue a producción falló o si se pidió un rollback manual
    needs: [deploy-production]
    if: ${{ always() && (needs.deploy-production.result == 'failure' || inputs.rollback) }}
    runs-on: ubuntu-latest
    # Sin 'environment': el rollback NO espera aprobación humana (urgencia).
    steps:
      - uses: actions/checkout@v4
      - name: Elegir la imagen a restaurar
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [ -n "$REQUESTED_SHA" ]; then
            echo "tag=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
            echo "version=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=stable" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Redesplegar la imagen elegida (SHA inmutable o :stable)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          curl -fsS -X POST -G --data-urlencode "imgURL=${IMAGE}:${TAG}" "$RENDER_HOOK"
      - name: Healthcheck tras el rollback
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./scripts/healthcheck.sh "$URL" "$VERSION"
      - name: Marcar el pipeline como fallido (hubo reversión)
        if: ${{ !inputs.rollback }}
        run: |
          echo "::error::Despliegue revertido a la imagen estable. Abrir postmortem (docs/postmortem-simulacion.md es la plantilla)."
          exit 1
