name: Prueba de carga (manual, solo staging)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL de STAGING (nunca producción)
        required: true

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 contra staging (p95 < 300 ms, errores < 1 %)
        run: k6 run k6/entradas.js
        env:
          TARGET_ENV: staging
          TARGET_URL: ${{ inputs.target_url }}
          K6_USER: ${{ secrets.K6_USER }}
          K6_PASS: ${{ secrets.K6_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-resultado
          path: k6/resultado-entradas.json
          if-no-files-found: ignore
          retention-days: 14
