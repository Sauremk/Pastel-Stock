<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Pastel Stock — Inventarios para pastelerías</title>
    <meta name="description" content="Pastel Stock: inventario de materias primas, recetas y productos terminados para Dulce Hogar.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="theme-color" content="#24170F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pastel Stock">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <!-- Arranque: mientras se intenta restaurar la sesión con el refresh token -->
    <div class="arranque" id="arranque" role="status">
        <div class="estado-carga"><div class="spinner" aria-hidden="true"></div><span>Cargando…</span></div>
    </div>

    <!-- LOGIN -->
    <div class="login-screen" id="login-screen" hidden>
        <div class="login-card">
            <div class="login-header">
                <img class="logo" src="img/logo.png" alt="" width="96" height="96">
                <h1>Pastel Stock</h1>
                <p>Sistema de gestión de inventarios · Dulce Hogar</p>
            </div>
            <form id="login-form" novalidate autocomplete="on">
                <div class="login-error" id="login-error" role="alert" hidden></div>
                <div class="form-group">
                    <label for="login-user">Usuario</label>
                    <input type="text" id="login-user" name="usuario" required autocomplete="username"
                           autocapitalize="none" spellcheck="false" placeholder="Ingresa tu usuario">
                </div>
                <div class="form-group">
                    <label for="login-pass">Contraseña</label>
                    <input type="password" id="login-pass" name="contrasena" required autocomplete="current-password"
                           placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" class="btn btn-block" id="login-submit">Iniciar sesión</button>
                <p class="login-aviso">Si no tienes usuario, solicítalo a la administración de Dulce Hogar.</p>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div class="app-container" id="app-container">
        <header class="topbar">
            <span class="marca"><img class="marca-logo" src="img/logo.png" alt="" width="32" height="32"> Pastel Stock</span>
            <button type="button" class="btn-alertas-top" id="btn-alertas-top" aria-label="Ver avisos">🔔<span class="nav-insignia" data-insignia-alertas hidden></span></button>
        </header>
        <div class="velo-menu" id="velo-menu" hidden></div>
        <aside class="sidebar" id="menu-lateral">
            <div class="sidebar-header">
                <img class="logo" src="img/logo.png" alt="" width="44" height="44">
                <h2>Pastel Stock</h2>
                <p id="nombre-tienda">Dulce Hogar · Inventarios</p>
            </div>

            <div class="user-info">
                <div class="user-avatar" id="user-avatar" aria-hidden="true">?</div>
                <div class="user-details">
                    <div class="name" id="user-name"></div>
                    <div class="role" id="user-role"></div>
                </div>
            </div>

            <nav aria-label="Secciones">
                <ul>
                    <li><button type="button" class="nav-item" data-vista="dashboard"><span class="nav-emoji" aria-hidden="true">🏠</span><span>Inicio</span></button></li>
                    <li><button type="button" class="nav-item" data-vista="ventas"><span class="nav-emoji" aria-hidden="true">🛒</span><span>Vender</span></button></li>
                    <li><button type="button" class="nav-item" data-vista="recetas"><span class="nav-emoji" aria-hidden="true">🧁</span><span>Hornear</span></button></li>
                    <li><button type="button" class="nav-item" data-vista="materias" data-activa-en="materias,productos,movimientos"><span class="nav-emoji" aria-hidden="true">📦</span><span>Inventario</span></button></li>
                    <li><button type="button" class="nav-item" data-vista="alertas"><span class="nav-emoji" aria-hidden="true">🔔</span><span>Avisos</span><span class="nav-insignia" data-insignia-alertas hidden></span></button></li>
                </ul>
                <p class="nav-grupo" aria-hidden="true">Más</p>
                <ul>
                    <li data-permiso="rentabilidad"><button type="button" class="nav-item" data-vista="rentabilidad"><span class="nav-emoji" aria-hidden="true">📈</span><span>Ganancias</span></button></li>
                    <li data-permiso="equipo"><button type="button" class="nav-item" data-vista="equipo"><span class="nav-emoji" aria-hidden="true">👥</span><span>Equipo</span></button></li>
                    <li><button type="button" class="nav-item nav-ayuda" id="btn-ayuda"><span class="nav-emoji" aria-hidden="true">❓</span><span>¿Cómo se usa?</span></button></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="theme-toggle">
                    <span class="theme-toggle-label">
                        <span id="theme-icon" aria-hidden="true">☀️</span>
                        <span id="theme-text">Modo claro</span>
                    </span>
                    <label class="switch sin-margen">
                        <span class="sr-only">Activar modo oscuro</span>
                        <input type="checkbox" id="theme-switch" role="switch">
                        <span class="slider"></span>
                    </label>
                </div>
                <button type="button" class="btn-logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </aside>
        <nav class="barra-inferior" aria-label="Accesos principales">
            <button type="button" class="nav-item" data-vista="dashboard"><span class="nav-emoji" aria-hidden="true">🏠</span><span>Inicio</span></button>
            <button type="button" class="nav-item" data-vista="ventas"><span class="nav-emoji" aria-hidden="true">🛒</span><span>Vender</span></button>
            <button type="button" class="nav-item" data-vista="recetas"><span class="nav-emoji" aria-hidden="true">🧁</span><span>Hornear</span></button>
            <button type="button" class="nav-item" data-vista="materias" data-activa-en="materias,productos,movimientos"><span class="nav-emoji" aria-hidden="true">📦</span><span>Inventario</span></button>
            <button type="button" class="nav-mas" id="btn-mas" aria-controls="menu-lateral" aria-expanded="false"><span class="nav-emoji" aria-hidden="true">☰</span><span>Más</span></button>
        </nav>

        <main class="main" id="contenido" tabindex="-1"></main>
    </div>

    <div id="modal-root"></div>
    <div class="toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

    <noscript><p class="aviso-noscript">Pastel Stock necesita JavaScript habilitado para funcionar.</p></noscript>

    <script src="vendor/chart.umd.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
